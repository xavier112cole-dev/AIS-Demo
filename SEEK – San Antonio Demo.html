<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEEK – San Antonio Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3EC;--surface:#FFFFFF;--ink:#13262B;--mute:#5B6B6E;--line:#D3DDD3;--accent:#2B47F5;--on-accent:#FFFFFF;--pop:#FFB81F;--on-pop:#13262B;--stage:#DDE6DB;
--font:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1C20;--surface:#172A2F;--ink:#EAF1EA;--mute:#9DB0B2;--line:#2A4247;--accent:#7C8DFF;--on-accent:#0F1C20;--pop:#FFB81F;--stage:#0A1215}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1C20;--surface:#172A2F;--ink:#EAF1EA;--mute:#9DB0B2;--line:#2A4247;--accent:#7C8DFF;--on-accent:#0F1C20;--pop:#FFB81F;--stage:#0A1215}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--stage);color:var(--ink);min-height:100vh;display:flex;justify-content:center;align-items:center}
.phone{width:100%;max-width:400px;height:min(820px,100vh);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:520px){.phone{border-radius:36px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.18);margin:16px}}
header{padding:16px 22px 8px;display:flex;align-items:center;justify-content:space-between}
.logo{width:52px;height:52px;display:block}
.tag{font-size:13px;color:var(--mute)}
main{flex:1;overflow-y:auto;padding:8px 22px 20px}
h2{font-size:26px;line-height:1.1;letter-spacing:-.03em;margin:10px 0 6px;font-weight:800}
p.lead{color:var(--mute);margin:0 0 18px;font-size:15px;line-height:1.45}
.q{margin:18px 0 8px;font-weight:600;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:16px;padding:15px 18px;width:100%;cursor:pointer;background:var(--accent);color:var(--on-accent);margin-top:22px}
.btn.pop{background:var(--pop);color:var(--on-pop);margin-top:0}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:18px;letter-spacing:-.02em}
.card p{margin:0 0 10px;font-size:14px;color:var(--mute);line-height:1.4}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;align-items:center}
.match{margin-left:auto;font-weight:700;color:var(--accent)}
.mini{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer}
.mini.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
nav button{flex:1;font:inherit;font-weight:600;font-size:14px;padding:14px 0;border:0;background:none;color:var(--mute);cursor:pointer}
nav button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.overlay{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;justify-content:center;padding:28px}
.reel{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:8px 0 14px;min-height:72px}
.reel.spin{color:var(--mute);animation:blur .12s linear infinite}
@keyframes blur{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.reel.spin{animation:none}}
.why{font-size:14px;color:var(--mute);margin:0 0 18px;line-height:1.45}
.empty{color:var(--mute);font-size:15px;line-height:1.5;padding:30px 0}
.tot{font-weight:700;margin:6px 0 14px}
.splash{position:absolute;inset:0;z-index:9;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:splashOut .5s ease 1.6s forwards}
.splash img{width:130px;height:130px;animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
.splash p{color:var(--bg);font-size:17px;margin:0;opacity:0;animation:fadeIn .6s ease .5s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.splash,.splash *{animation-duration:.01s!important;animation-delay:0s!important}}
.card{border-left:6px solid var(--c,var(--line));cursor:pointer}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--pop);color:var(--on-pop)}
a.btn{display:block;text-align:center;text-decoration:none}
.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;white-space:nowrap}
</style>
</head>

function feasible(){return ACTIVITIES.filter(a=>a.cost<=S.budget&&a.mi<=S.dist&&a.who.includes(S.who));}
function score(a){
  const vibeHit=S.vibes.length?a.vibe.filter(v=>S.vibes.includes(v)).length/S.vibes.length:.5;
  const novFit=1-Math.abs(a.nov-S.adv)/4;                 // how close to the user's adventure level
  const price=1-a.cost/Math.max(S.budget,1);              // cheaper = nicer
  return .5*vibeHit+.35*novFit+.15*price;
}
function ranked(){return feasible().map(a=>({a,s:score(a)})).sort((x,y)=>y.s-x.s);}
function pickRandom(){                                    // weighted random: good fits are likelier, but anything feasible can win
  const pool=ranked().map(r=>({a:r.a,w:r.s*r.s+.05}));
  if(!pool.length)return null;
  let t=Math.random()*pool.reduce((n,p)=>n+p.w,0);
  for(const p of pool){t-=p.w;if(t<=0)return p.a;}
  return pool[0].a;
}
function why(a){
  const bits=[];
  const m=a.vibe.filter(v=>S.vibes.includes(v));
  if(m.length)bits.push("fits your "+m.join(" + ").toLowerCase()+" mood");
  bits.push(a.cost===0?"it’s free":"about $"+a.cost+" per person");
  if(a.nov>=S.adv+1)bits.push("a step outside your comfort zone");
  return "Why this: "+bits.join(", ")+".";
}

// ---------- Rendering ----------
const $=s=>document.querySelector(s);
const chip=(label,on,attr)=>`<button class="chip" aria-pressed="${on}" ${attr}>${label}</button>`;
const inPlan=id=>S.plan.some(a=>a.id===id);

function setupView(){return `
 <h2>Tell us how you feel today.</h2>
 <p class="lead">Five quick answers. We’ll handle the planning.</p>
 <div class="q">Who’s coming?</div>
 <div class="chips">${WHO.map(w=>chip(w,S.who===w,`data-who="${w}"`)).join("")}</div>
 <div class="q">What sounds good? (pick any)</div>
 <div class="chips">${VIBES.map(v=>chip(v,S.vibes.includes(v),`data-vibe="${v}"`)).join("")}</div>
 <div class="q">Budget per person: <b id="bv">$${S.budget}</b></div>
 <input type="range" min="0" max="60" step="5" value="${S.budget}" id="budget" aria-label="Budget per person">
 <div class="q">How far from UTSA?</div>
 <div class="chips">${[[8,"Near campus"],[18,"Around town"],[25,"Anywhere in SA"]].map(([v,l])=>chip(l,S.dist===v,`data-dist="${v}"`)).join("")}</div>
 <div class="q">How adventurous?</div>
 <input type="range" min="1" max="5" step="1" value="${S.adv}" id="adv" aria-label="Adventure level">
 <div class="row"><span>Familiar</span><span>Totally new to me</span></div>
 <button class="btn" data-go="picks">Show my picks</button>`;}

function cardHTML(a,s){return `<div class="card" data-open="${a.id}" style="--c:${COL[a.vibe[0]]}">
 <h3>${a.name}</h3><p>${a.blurb}</p>
 <div class="meta"><span>${a.cost?"$"+a.cost:"Free"}</span><span>${a.mins} min</span><span>${a.area}, ~${a.mi} mi</span>${a.nov>=S.adv+1?`<span class="pill">Stretch</span>`:""}
 ${s!=null?`<span class="match">${Math.round(s*100)}% match</span>`:""}
 <button class="mini ${inPlan(a.id)?"on":""}" data-save="${a.id}">${inPlan(a.id)?"In plan":"Add to plan"}</button></div></div>`;}

function picksView(){
  const r=ranked().slice(0,5);
  return `<h2>Your picks</h2>
  <p class="lead">${S.who}, ${S.vibes.join(" + ").toLowerCase()||"anything"}, up to $${S.budget}, within ~${S.dist} mi of UTSA.</p>
  <button class="btn pop" data-surprise>Surprise me</button>
  <div style="height:16px"></div>
  ${r.length?r.map(x=>cardHTML(x.a,x.s)).join(""):`<div class="empty">Nothing fits that budget yet. Raise it a little or change who’s coming.</div>`}
  <button class="btn ghost" data-go="setup">Change answers</button>
  <p class="tag" style="margin-top:14px">Prices, hours, and distances are estimates from UTSA Main Campus. Confirm before you go.</p>`;
}

function planView(){
  const total=S.plan.reduce((n,a)=>n+a.cost,0);
  return `<h2>Your plan</h2>
  ${S.plan.length?`<p class="tot">Estimated cost: $${total} per person</p>`+S.plan.map(a=>cardHTML(a,null)).join("")+`<button class="btn" data-share>Share this plan</button><p class="tag" style="margin-top:14px">Time with friends and family supports well-being, the goal behind SEEK.</p>`:`<div class="empty">No outings saved yet. Add one from your picks or spin the surprise.</div>`}`;
}

function overlayHTML(){
  const a=S.surprise;
  return `<div class="overlay" role="dialog" aria-label="Surprise activity">
   <div class="tag">${S.spinning?"Choosing for you…":"Your surprise"}</div>
   <div class="reel ${S.spinning?"spin":""}" aria-live="polite">${S.spinning?S.spinText:a?a.name:"No match"}</div>
   ${!S.spinning&&a?`<p class="why">${a.blurb}<br>${a.cost?"$"+a.cost:"Free"} · ${a.mins} min · ${a.area}<br><br>${why(a)}</p>
   <button class="btn pop" data-save="${a.id}">${inPlan(a.id)?"Added to plan":"Add to plan"}</button>
   <button class="btn ghost" data-surprise>Spin again</button>
   <a class="btn ghost" href="${mapLink(a)}" target="_blank" rel="noopener">View on map</a>`:""}
   <button class="btn ghost" data-close>Close</button></div>`;
}

const COL={Outdoors:"#2E9E6B",Food:"#E4572E",Creative:"#9B5DE5",Active:"#2B47F5",Chill:"#14A3A8",Culture:"#D4A017"};
const mapLink=a=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a.name+" San Antonio TX");
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast="";render();},2200);}
async function share(){
  const t="My SEEK plan:\n"+S.plan.map(a=>"• "+a.name+" ("+a.area+")").join("\n");
  try{if(navigator.share){await navigator.share({text:t});return;}await navigator.clipboard.writeText(t);toast("Plan copied");}
  catch(e){if(e.name!=="AbortError")toast("Sharing isn’t available here");}
}
function detailHTML(){
  const a=ACTIVITIES.find(x=>x.id===S.detail);
  return `<div class="overlay" role="dialog" aria-label="${a.name}"><div class="tag">${a.area}, ~${a.mi} mi from UTSA</div>
   <div class="reel" style="font-size:30px">${a.name}</div>
   <p class="why">${a.blurb}<br>${a.cost?"$"+a.cost+" per person":"Free"} · about ${a.mins} min<br><br>${why(a)}</p>
   <button class="btn pop" data-save="${a.id}">${inPlan(a.id)?"In your plan":"Add to plan"}</button>
   <a class="btn ghost" href="${mapLink(a)}" target="_blank" rel="noopener">View on map</a>
   <button class="btn ghost" data-close>Close</button></div>`;
}

function render(){
  const body=S.tab==="setup"?setupView():S.tab==="picks"?picksView():planView();
  $("#app").innerHTML=`<header><img class="logo" src="${LOGO}" alt="SEEK" width="52" height="52"><div class="tag">Go somewhere new in San Antonio</div></header>
   <main>${body}</main>
   <nav><button data-go="${S.tab==="setup"?"setup":"picks"}" aria-current="${S.tab!=="plan"?"page":"false"}">Discover</button>
   <button data-go="plan" aria-current="${S.tab==="plan"?"page":"false"}">Plan (${S.plan.length})</button></nav>
   ${S.detail!==null?detailHTML():S.surprise!==null||S.spinning?overlayHTML():""}
   ${S.toast?`<div class="toast" role="status">${S.toast}</div>`:""}
   ${S.splash?`<div class="splash"><img src="${LOGO}" alt=""><p>Break away from the usual.</p></div>`:""}`;
}

// ---------- Surprise spinner ----------
function spin(){
  const pool=feasible();
  S.spinning=true;S.surprise=pool.length?{}:null;render();
  if(!pool.length){S.spinning=false;render();return;}
  let i=0;
  const tick=()=>{S.spinText=pool[Math.floor(Math.random()*pool.length)].name;const r=$(".reel");if(r)r.textContent=S.spinText;
    if(++i>=14){S.spinning=false;S.surprise=pickRandom();render();return;}
    setTimeout(tick,60+i*i*3);};   // slows down like a real spinner
  tick();
}

// ---------- Events ----------
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-who],[data-dist],[data-vibe],[data-go],[data-save],[data-surprise],[data-close],[data-open],[data-share]");
  if(!el)return;
  const d=el.dataset;
  if(d.who){S.who=d.who;}
  else if(d.dist){S.dist=+d.dist;}
  else if(d.vibe){S.vibes=S.vibes.includes(d.vibe)?S.vibes.filter(v=>v!==d.vibe):[...S.vibes,d.vibe];}
  else if(d.go){S.tab=d.go;S.surprise=null;S.detail=null;}
  else if(d.save){const id=+d.save;S.plan=inPlan(id)?S.plan.filter(a=>a.id!==id):[...S.plan,ACTIVITIES.find(a=>a.id===id)];}
  else if(d.open){S.detail=+d.open;}
  else if(d.share!==undefined){share();return;}
  else if(d.surprise!==undefined){spin();return;}
  else if(d.close!==undefined){S.surprise=null;S.detail=null;}
  const sc=document.querySelector("main")?.scrollTop||0;render();
  const m=document.querySelector("main");if(m)m.scrollTop=sc;
});
document.addEventListener("input",e=>{
  if(e.target.id==="budget"){S.budget=+e.target.value;$("#bv").textContent="$"+S.budget;}
  if(e.target.id==="adv"){S.adv=+e.target.value;}
});
render();
setTimeout(()=>{S.splash=false;},2300);
</script>
</body>
</html>
